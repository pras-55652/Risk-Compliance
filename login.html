<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - B-INNOVATE PT Bakrie Autoparts</title>
    <style>
      :root {
        --primary: #d97706;
        --primary-hover: #b45309;
        --dark: #0f172a;
        --slate: #475569;
        --line: #e2e8f0;
        --bg: #f8fafc;
      }
      * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .login-card { background: #ffffff; width: 100%; max-width: 420px; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--line); }
      .logo-badge { display: inline-block; background: #fef3c7; color: #92400e; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
      h2 { margin: 0 0 6px 0; color: var(--dark); font-size: 22px; }
      .sub { color: var(--slate); font-size: 13px; margin-bottom: 20px; }
      .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
      label { font-size: 12px; font-weight: 600; color: var(--slate); }
      input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none; background: #fff; }
      input:focus, select:focus { border-color: var(--primary); }
      
      /* Styling Khusus Bungkus Password + Icon Mata */
      .password-container { position: relative; width: 100%; display: flex; align-items: center; }
      .password-container input { width: 100%; padding-right: 42px; }
      .btn-eye { position: absolute; right: 10px; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; color: #64748b; }
      .btn-eye:hover { color: var(--primary); }
      .btn-eye svg { width: 20px; height: 20px; }

      .dev-box { background: #fffbeb; border: 1px dashed #f59e0b; padding: 12px; border-radius: 6px; margin-bottom: 14px; display: none; }
      .dev-title { font-size: 11px; font-weight: 700; color: #b45309; margin-bottom: 6px; text-transform: uppercase; }
      button.btn-submit { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
      button.btn-submit:hover { background: var(--primary-hover); }
      button.btn-google { width: 100%; padding: 12px; background: #ffffff; color: #333333; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
      button.btn-google:hover { background: #f8fafc; }
      .divider { display: flex; align-items: center; text-align: center; margin: 16px 0; color: #94a3b8; font-size: 12px; }
      .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
      .divider span { padding: 0 10px; }
      .toggle-mode { text-align: center; margin-top: 18px; font-size: 13px; color: var(--slate); }
      .toggle-mode a { color: var(--primary); font-weight: 600; text-decoration: none; cursor: pointer; }
      .toggle-mode a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo-badge">B-INNOVATE SYSTEM</div>
      <h2 id="formTitle">Portal Masuk Karyawan</h2>
      <div class="sub">PT Bakrie Autoparts - Continuous Improvement</div>

      <button type="button" class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
        Masuk dengan Akun Google
      </button>

      <div class="divider"><span id="dividerText">atau masuk dengan email</span></div>

      <form onsubmit="handleAuth(event)">
        <div class="field">
          <label>Email Perusahaan / Akun *</label>
          <input type="email" id="email" placeholder="email@bakrie-autoparts.com" oninput="checkDeveloperEmail(this.value)" required />
        </div>

        <!-- Dropdown Khusus Developer -->
        <div class="dev-box" id="devRoleBox">
          <div class="dev-title">⚙️ Developer Mode (Pilih Role Testing)</div>
          <select id="devSelectedRole">
            <option value="CI_TEAM">👑 CI Team (Super Admin)</option>
            <option value="PIC">✍️ PIC / Team Leader (Operational)</option>
            <option value="FASILITATOR">🧭 Fasilitator Lapangan (Operational)</option>
            <option value="MANAGER">🏛️ Department Manager (Operational)</option>
            <option value="FINANCE">💰 Finance Verifier (Financial Directorate)</option>
            <option value="MGR_RISK">🛡️ Head of Risk & Compliance</option>
          </select>
        </div>

        <div class="field">
          <label>Password *</label>
          <div class="password-container">
            <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6" />
            <!-- Tombol dengan Icon Mata SVG -->
            <button type="button" class="btn-eye" id="togglePassBtn" onclick="togglePasswordVisibility()" title="Lihat/Sembunyikan Sandi">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Masuk ke Dashboard &rarr;
        </button>
      </form>

      <div class="toggle-mode">
        <span id="toggleText">Belum punya akun?</span> 
        <a onclick="toggleFormMode()" id="toggleLink">Daftar di sini</a>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyA2XzMogtbxIOf1IGF_3ufb8BWryr8xSek",
        authDomain: "monitoring-ci-e12ca.firebaseapp.com",
        projectId: "monitoring-ci-e12ca",
        storageBucket: "monitoring-ci-e12ca.firebasestorage.app",
        messagingSenderId: "884090638769",
        appId: "1:884090638769:web:ebba5e7dd5812b2d512d90",
        measurementId: "G-MQE4E3S4TY"
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      let isLoginMode = true;

      // Fungsi untuk melihat/menyembunyikan sandi sekaligus mengubah icon mata
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");
        
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          // Ubah icon jadi mata tercoret (tanda disembunyikan)
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          `;
        } else {
          passwordInput.type = "password";
          // Kembalikan ke icon mata normal
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          `;
        }
      }

      function checkDeveloperEmail(email) {
        const devBox = document.getElementById("devRoleBox");
        if (email.trim().toLowerCase() === "mprahastika@gmail.com") {
          devBox.style.display = "block";
        } else {
          devBox.style.display = "none";
        }
      }

      function determineRole(email) {
        const lowerEmail = email.toLowerCase();
        if (lowerEmail === "mprahastika@gmail.com") {
          return document.getElementById("devSelectedRole").value;
        }
        if (lowerEmail.includes("admin") || lowerEmail.includes("ci")) {
          return "CI_TEAM";
        } else if (lowerEmail.includes("manager")) {
          return "MANAGER";
        } else if (lowerEmail.includes("finance")) {
          return "FINANCE";
        } else if (lowerEmail.includes("risk")) {
          return "MGR_RISK";
        } else if (lowerEmail.includes("fasilitator")) {
          return "FASILITATOR";
        } else {
          return "PIC";
        }
      }

      function toggleFormMode() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
          document.getElementById("formTitle").innerText = "Portal Masuk Karyawan";
          document.getElementById("submitBtn").innerHTML = "Masuk ke Dashboard &rarr;";
          document.getElementById("toggleText").innerText = "Belum punya akun?";
          document.getElementById("toggleLink").innerText = "Daftar di sini";
        } else {
          document.getElementById("formTitle").innerText = "Pendaftaran Akun Baru";
          document.getElementById("submitBtn").innerHTML = "Buat Akun Sekarang";
          document.getElementById("toggleText").innerText = "Sudah punya akun?";
          document.getElementById("toggleLink").innerText = "Masuk di sini";
        }
      }

      function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const assignedRole = determineRole(email);

        if (isLoginMode) {
          auth.signInWithEmailAndPassword(email, password)
            .then(() => {
              localStorage.setItem("binnovate_user_role", assignedRole);
              window.location.href = "index.html";
            })
            .catch((error) => {
              alert("Gagal Login: Email atau Password salah.");
            });
        } else {
          auth.createUserWithEmailAndPassword(email, password)
            .then(() => {
              localStorage.setItem("binnovate_user_role", assignedRole);
              alert("Akun berhasil didaftarkan! Masuk ke Dashboard...");
              window.location.href = "index.html";
            })
            .catch((error) => {
              alert("Gagal Daftar: " + error.message);
            });
        }
      }

      function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
          .then((result) => {
            const userEmail = result.user.email;
            const assignedRole = determineRole(userEmail);
            localStorage.setItem("binnovate_user_role", assignedRole);
            window.location.href = "index.html";
          })
          .catch((error) => {
            alert("Gagal Login Google: " + error.message);
          });
      }
    </script>
  </body>
</html>
